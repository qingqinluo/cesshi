<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, viewport-fit=cover" />
<title>网络262课程表</title>
<style>
  :root {
    --bg: #f3f1fb;
    --card: #ffffff;
    --ink: #2b2b3a;
    --muted: #8a8a9a;
    --line: #ece9f7;
    --primary: #5b4fc4;
    --primary-2: #9b8bf0;

    --python: #5b4fc4;
    --military: #e0569e;
    --math: #f09a37;
    --english: #3d7de8;
    --pe: #27b07a;
    --morality: #e8645a;
    --network: #0ea5a0;
    --career: #8b5cf6;
    --psych: #f43f5e;
    --situation: #d97706;
    --humanity: #16a34a;
    --network: #0ea5a0;
    --career: #8b5cf6;
    --psych: #f43f5e;
    --situation: #d97706;
    --humanity: #16a34a;
    --network: #0ea5a0;
    --career: #8b5cf6;
    --psych: #f43f5e;
    --situation: #d97706;
    --humanity: #16a34a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", -apple-system, sans-serif;
    background: linear-gradient(135deg, #ece7fb 0%, #f8eef6 45%, #eef3fd 100%);
    min-height: 100vh;
    color: var(--ink);
    padding: 40px 16px 60px;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 1060px;
    margin: 0 auto;
    padding: 0 12px;
  }

  /* ---------- 横屏提示 ---------- */
  .rotate-hint {
    display: none;
    text-align: center;
    font-size: 13px;
    color: #a89dd8;
    margin-top: 18px;
  }
  .rotate-hint .icon { font-size: 20px; display: inline-block; animation: spin 1.6s ease-in-out infinite; }
  @keyframes spin { 0%,60%,100% { transform: rotate(0deg); } 30% { transform: rotate(90deg); } }

  /* 竖屏且窄屏时，提示旋转手机 */
  @media (orientation: portrait) and (max-width: 640px) {
    .rotate-hint { display: block; }
  }

  /* ---------- Header ---------- */
  header {
    position: relative;
    overflow: hidden;
    background: linear-gradient(120deg, #4c3fae 0%, #7a5fd0 55%, #b06fd8 100%);
    color: #fff;
    border-radius: 24px;
    padding: 42px 40px;
    box-shadow: 0 20px 45px -18px rgba(91, 79, 196, 0.65);
  }
  header::before {
    content: "";
    position: absolute;
    right: -70px; top: -70px;
    width: 240px; height: 240px;
    background: radial-gradient(circle, rgba(255,255,255,.18) 0%, transparent 65%);
    border-radius: 50%;
  }
  header::after {
    content: "";
    position: absolute;
    right: 60px; bottom: -90px;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(255,255,255,.12) 0%, transparent 65%);
    border-radius: 50%;
  }
  .title {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 1px;
    position: relative;
    z-index: 1;
  }
  .title .emoji { margin-right: 10px; }
  .subtitle {
    margin-top: 10px;
    font-size: 15px;
    color: rgba(255,255,255,.85);
    position: relative;
    z-index: 1;
  }
  .chips { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; position: relative; z-index: 1; }
  .chip {
    background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.28);
    padding: 5px 13px;
    border-radius: 999px;
    font-size: 13px;
    backdrop-filter: blur(4px);
  }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex;
    gap: 10px;
    margin: 26px 0 20px;
  }
  .tab {
    flex: 1;
    max-width: 260px;
    padding: 14px 22px;
    font-size: 16px;
    font-weight: 600;
    color: var(--muted);
    background: rgba(255,255,255,.7);
    border: 1px solid transparent;
    border-radius: 14px;
    cursor: pointer;
    transition: all .22s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    backdrop-filter: blur(6px);
  }
  .tab:hover { color: var(--primary); background: #fff; }
  .tab.active {
    color: #fff;
    background: linear-gradient(120deg, #5b4fc4, #8a6fe0);
    box-shadow: 0 10px 24px -10px rgba(91,79,196,.7);
  }

  /* ---------- Panels ---------- */
  .panel { display: none; }
  .panel.active { display: block; animation: reveal .35s ease; }
  @keyframes reveal {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }

  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 14px 40px -22px rgba(60,50,120,.35);
    overflow-x: auto;
  }

  /* ---------- Week badge ---------- */
  .week-banner { display: flex; justify-content: flex-end; margin-bottom: 14px; }
  .week-badge {
    font-size: 13px;
    font-weight: 600;
    color: var(--primary);
    background: #f0edfb;
    border: 1px solid #e3dcf9;
    padding: 4px 13px;
    border-radius: 999px;
    letter-spacing: 1px;
  }

  /* ---------- Schedule table ---------- */
  table.schedule {
    width: 100%;
    border-collapse: separate;
    border-spacing: 6px;
    min-width: 820px;
  }
  table.schedule th, table.schedule td {
    border-radius: 12px;
    vertical-align: top;
  }
  table.schedule thead th {
    background: #f0edfb;
    color: #5b4fc4;
    font-weight: 700;
    font-size: 14px;
    padding: 12px 8px;
    text-align: center;
  }
  table.schedule thead th .date {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: #a89dd8;
    margin-top: 2px;
  }
  table.schedule td.time {
    background: #f0edfb;
    color: #4c3fae;
    font-weight: 700;
    font-size: 13px;
    text-align: center;
    width: 88px;
    padding: 12px 6px;
    white-space: nowrap;
  }
  table.schedule td.time .period { display: block; font-size: 15px; }
  table.schedule td.time .clock { display: block; font-size: 11px; color: #9a8fd0; margin-top: 4px; font-weight: 500; }
  table.schedule td.cell {
    height: 108px;
    background: #faf9fe;
    border: 1px solid #f0edfb;
    padding: 0;
    vertical-align: top;
  }
  table.schedule td.cell .cell-inner {
    height: 100%;
    min-height: 108px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  table.schedule td.empty { background: #faf9fe; }

  .course {
    flex: 1 1 auto;
    min-height: 84px;
    border-radius: 12px;
    padding: 10px 12px;
    border-left: 4px solid var(--c);
    background: color-mix(in srgb, var(--c) 9%, #fff);
    display: flex;
    flex-direction: column;
    gap: 5px;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .course:hover { transform: translateY(-2px); box-shadow: 0 8px 18px -10px var(--c); }
  .course .name { font-weight: 700; font-size: 14px; line-height: 1.35; color: var(--ink); }
  .course .meta { font-size: 12px; color: var(--muted); line-height: 1.4; }
  .course .meta b { color: color-mix(in srgb, var(--c) 70%, #222); font-weight: 600; }
  .course .week {
    margin-top: auto;
    font-size: 11px;
    font-weight: 600;
    color: var(--c);
    background: color-mix(in srgb, var(--c) 13%, #fff);
    align-self: flex-start;
    padding: 2px 8px;
    border-radius: 999px;
  }

  @media (max-width: 640px) {
    body { padding: 20px 8px 40px; }
    header { padding: 28px 20px; border-radius: 18px; }
    .title { font-size: 24px; }
    .subtitle { font-size: 13px; }
    .chips .chip { font-size: 12px; padding: 4px 10px; }
    .tabs { margin: 18px 0 14px; }
    .tab { font-size: 14px; padding: 11px 14px; border-radius: 12px; }
    table.schedule { border-spacing: 4px; }
    table.schedule thead th { font-size: 12px; padding: 9px 4px; }
    table.schedule td.time { font-size: 11px; width: 70px; padding: 8px 3px; }
    table.schedule td.time .period { font-size: 12px; }
    table.schedule td.time .clock { font-size: 10px; }
    table.schedule td.cell { height: 92px; }
    table.schedule td.cell .cell-inner { min-height: 92px; }
    .course { padding: 8px 9px; min-height: 70px; }
    .course .name { font-size: 12px; }
    .course .meta { font-size: 11px; }
    .course .week { font-size: 10px; }
    .week-banner { margin-bottom: 10px; }
  }

  /* ---------- Legend ---------- */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 18px;
    margin-top: 20px;
    padding: 14px 16px;
    background: #faf9fe;
    border-radius: 14px;
  }
  .legend .item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #555566; }
  .legend .dot { width: 12px; height: 12px; border-radius: 4px; }

  /* ---------- Detail table ---------- */
  table.detail { width: 100%; border-collapse: collapse; min-width: 720px; }
  table.detail th {
    text-align: left;
    font-size: 13px;
    color: var(--muted);
    font-weight: 600;
    padding: 12px 14px;
    border-bottom: 2px solid var(--line);
    white-space: nowrap;
  }
  table.detail td {
    padding: 15px 14px;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  table.detail tr:last-child td { border-bottom: none; }
  table.detail tr:hover td { background: #faf9fe; }
  table.detail .cname { font-weight: 600; display: flex; align-items: center; gap: 9px; }
  table.detail .cname .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    color: #6a6a7a;
    background: #f0edfb;
  }
  .week-tag { background: color-mix(in srgb, var(--c) 13%, #fff); color: var(--c); }

  /* ---------- Map ---------- */
  .map-wrap {
    text-align: center;
  }
  .map-img {
    width: 100%;
    max-width: 720px;
    border-radius: 14px;
    box-shadow: 0 10px 28px -16px rgba(60,50,120,.4);
  }
  .map-tip {
    margin-top: 12px;
    font-size: 13px;
    color: var(--muted);
  }
  .map-tip .icon { font-size: 16px; }

  footer {
    margin-top: 26px;
    text-align: center;
    color: #a8a2c0;
    font-size: 13px;
  }

    /* ---------- 周次选择器 ---------- */
    .week-selector {
      display: flex; align-items: center; gap: 10px;
      justify-content: flex-end; margin-bottom: 14px; flex-wrap: wrap;
    }
    .week-selector label { font-size: 13px; font-weight: 600; color: var(--muted); }
    .week-selector .btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .wk-btn {
      min-width: 40px; padding: 7px 11px; font-size: 13px; font-weight: 700;
      color: var(--primary); background: #f0edfb; border: 1px solid #e3dcf9;
      border-radius: 10px; cursor: pointer; transition: all .18s ease;
    }
    .wk-btn:hover { background: #e6e0f8; }
    .wk-btn.on { color: #fff; background: linear-gradient(120deg, #5b4fc4, #8a6fe0);
      border-color: transparent; box-shadow: 0 6px 16px -8px rgba(91,79,196,.7); }
    .course.off { opacity: .28; filter: grayscale(.4); }
  
    /* ---------- 周次选择器 ---------- */
    .week-selector {
      display: flex; align-items: center; gap: 10px;
      justify-content: flex-end; margin-bottom: 14px; flex-wrap: wrap;
    }

    .week-selector .btns { display: flex; gap: 6px; flex-wrap: wrap; }

    }
    .wk-btn:hover { background: #e6e0f8; }

      border-color: transparent; box-shadow: 0 6px 16px -8px rgba(91,79,196,.7); }

    }

    .week-selector .btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .wk-btn {
      min-width: 40px; padding: 7px 11px; font-size: 13px; font-weight: 700;

    }
    .wk-btn:hover { background: #e6e0f8; }
    .wk-btn.on { color: #fff; background: linear-gradient(120deg, #5b4fc4, #8a6fe0);

    .course.off { opacity: .28; filter: grayscale(.4); }
  </style>
</head>
<body>
  <div class="page">
    <header>
                        <div class="title"><span class="emoji">📚</span>网络262课程表</div>
      <div class="subtitle">大一上学期 · 每周课程安排</div>
      <div class="chips">
        <span class="chip">📅 周一至周五</span>
        <span class="chip">🕐 共 11 门课程</span>
        <span class="chip">🎯 可按周次筛选</span>

    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="schedule">🗓️ 课程表</button>

      <button class="tab" data-tab="map">🗺️ 校园地图</button>

    <main>

          <table class="schedule">
            <thead>
              <tr>
                <th style="width:88px">时间</th>
                <th>周一<span class="date"></span></th>
                <th>周二<span class="date"></span></th>
                <th>周三<span class="date"></span></th>
                <th>周四<span class="date"></span></th>
                <th>周五<span class="date"></span></th>
              </tr>
            </thead>
            <tbody id="scheduleBody"></tbody>
          </table>

          <div class="legend" id="legend"></div>
        </div>
      </section>

      <section id="detail" class="panel">
        <div class="card">
          <table class="detail">
            <thead>
              <tr>

    const CELLS = [{"day": 0, "prd": 0, "list": [{"name": "军事理论（国防安全教育）", "teacher": "谢琴", "loc": "C2-201", "wk": "第3-5周", "ranges": [[3, 5]], "color": "--military"}]}, {"day": 0, "prd": 1, "list": [{"name": "应用数学", "teacher": "方娇红", "loc": "B1-503", "wk": "第3-18周", "ranges": [[3, 18]], "color": "--math"}]}, {"day": 0, "prd": 2, "list": [{"name": "Python程序设计", "teacher": "李桂凤", "loc": "实训1-307", "wk": "第1-17周", "ranges": [[1, 17]], "color": "--python"}]}, {"day": 0, "prd": 3, "list": [{"name": "形势与政策1", "teacher": "黄玉华", "loc": "C1-301", "wk": "第11-14周", "ranges": [[11, 14]], "color": "--situation"}, {"name": "人文艺术1", "teacher": "刘忠华", "loc": "B2-202", "wk": "第7-10周", "ranges": [[7, 10]], "color": "--humanity"}]}, {"day": 0, "prd": 4, "list": [{"name": "数据通信与网络技术", "teacher": "袁劲松", "loc": "实训1-307", "wk": "第4-5,7-12周", "ranges": [[4, 5], [7, 8], [9, 12]], "color": "--network"}]}, {"day": 1, "prd": 1, "list": [{"name": "Python程序设计", "teacher": "李桂凤", "loc": "实训1-307", "wk": "第1-17周", "ranges": [[1, 17]], "color": "--python"}]}, {"day": 1, "prd": 2, "list": [{"name": "数据通信与网络技术", "teacher": "袁劲松", "loc": "实训1-307", "wk": "第4-17周", "ranges": [[4, 17]], "color": "--network"}]}, {"day": 1, "prd": 4, "list": [{"name": "思想道德与法治（一）", "teacher": "李愿来", "loc": "B2-104", "wk": "第3-16周", "ranges": [[3, 16]], "color": "--morality"}]}, {"day": 2, "prd": 1, "list": [{"name": "大学生职业发展规划（一）", "teacher": "李甜甜", "loc": "B2-103", "wk": "第4,6,8,10,12,14周", "ranges": [[4, 4], [6, 6], [8, 8], [10, 10], [12, 12], [14, 14]], "color": "--career"}]}, {"day": 3, "prd": 1, "list": [{"name": "体育（一）（羽毛球）", "teacher": "李东耀", "loc": "—（原图未显示）", "wk": "第3-18周", "ranges": [[3, 18]], "color": "--pe"}]}, {"day": 3, "prd": 2, "list": [{"name": "数据通信与网络技术", "teacher": "袁劲松", "loc": "实训1-307", "wk": "第4-17周", "ranges": [[4, 17]], "color": "--network"}]}, {"day": 3, "prd": 3, "list": [{"name": "大学英语（一）", "teacher": "柯粒", "loc": "B1-401", "wk": "第3-17周", "ranges": [[3, 17]], "color": "--english"}]}, {"day": 4, "prd": 0, "list": [{"name": "大学英语（一）", "teacher": "柯粒", "loc": "B1-401", "wk": "第3-17周", "ranges": [[3, 17]], "color": "--english"}]}, {"day": 4, "prd": 2, "list": [{"name": "心理健康教育1", "teacher": "肖瑶", "loc": "B1-101", "wk": "第11-14周", "ranges": [[11, 14]], "color": "--psych"}]}];
    const COURSES = [{"name": "军事理论（国防安全教育）", "day": "周一", "prd": "01-02节", "loc": "C2-201", "teacher": "谢琴", "wk": "第3-5周", "color": "--military", "ranges": [[3, 5]]}, {"name": "大学英语（一）", "day": "周五", "prd": "01-02节", "loc": "B1-401", "teacher": "柯粒", "wk": "第3-17周", "color": "--english", "ranges": [[3, 17]]}, {"name": "应用数学", "day": "周一", "prd": "03-04节", "loc": "B1-503", "teacher": "方娇红", "wk": "第3-18周", "color": "--math", "ranges": [[3, 18]]}, {"name": "Python程序设计", "day": "周二", "prd": "03-04节", "loc": "实训1-307", "teacher": "李桂凤", "wk": "第1-17周", "color": "--python", "ranges": [[1, 17]]}, {"name": "大学生职业发展规划（一）", "day": "周三", "prd": "03-04节", "loc": "B2-103", "teacher": "李甜甜", "wk": "第4,6,8,10,12,14周", "color": "--career", "ranges": [[4, 4], [6, 6], [8, 8], [10, 10], [12, 12], [14, 14]]}, {"name": "体育（一）（羽毛球）", "day": "周四", "prd": "03-04节", "loc": "—（原图未显示）", "teacher": "李东耀", "wk": "第3-18周", "color": "--pe", "ranges": [[3, 18]]}, {"name": "Python程序设计", "day": "周一", "prd": "05-06节", "loc": "实训1-307", "teacher": "李桂凤", "wk": "第1-17周", "color": "--python", "ranges": [[1, 17]]}, {"name": "数据通信与网络技术", "day": "周二", "prd": "05-06节", "loc": "实训1-307", "teacher": "袁劲松", "wk": "第4-17周", "color": "--network", "ranges": [[4, 17]]}, {"name": "数据通信与网络技术", "day": "周四", "prd": "05-06节", "loc": "实训1-307", "teacher": "袁劲松", "wk": "第4-17周", "color": "--network", "ranges": [[4, 17]]}, {"name": "心理健康教育1", "day": "周五", "prd": "05-06节", "loc": "B1-101", "teacher": "肖瑶", "wk": "第11-14周", "color": "--psych", "ranges": [[11, 14]]}, {"name": "形势与政策1", "day": "周一", "prd": "07-08节", "loc": "C1-301", "teacher": "黄玉华", "wk": "第11-14周", "color": "--situation", "ranges": [[11, 14]]}, {"name": "大学英语（一）", "day": "周四", "prd": "07-08节", "loc": "B1-401", "teacher": "柯粒", "wk": "第3-17周", "color": "--english", "ranges": [[3, 17]]}, {"name": "人文艺术1", "day": "周一", "prd": "07-08节", "loc": "B2-202", "teacher": "刘忠华", "wk": "第7-10周", "color": "--humanity", "ranges": [[7, 10]]}, {"name": "数据通信与网络技术", "day": "周一", "prd": "09-10节", "loc": "实训1-307", "teacher": "袁劲松", "wk": "第4-5,7-12周", "color": "--network", "ranges": [[4, 5], [7, 8], [9, 12]]}, {"name": "思想道德与法治（一）", "day": "周二", "prd": "09-10节", "loc": "B2-104", "teacher": "李愿来", "wk": "第3-16周", "color": "--morality", "ranges": [[3, 16]]}];
    const TIMES = {
      '01-02节':'08:30-10:10', '03-04节':'10:20-12:00', '05-06节':'14:00-15:40',
      '07-08节':'15:50-17:30', '09-10节':'18:30-20:05', '11-12节':'20:15-21:50'
    };

    // 第 1 周周一 = 8/31（第 3 周周一为 9/14）
    const MON0 = new Date(2026, 7, 31); // 月从0开始，7=8月

    const allWeeks = new Set();
    CELLS.forEach(c => c.list.forEach(k => k.ranges.forEach(r => {
      for (let w = r[0]; w <= r[1]; w++) allWeeks.add(w);
    })));
    const weeks = [...allWeeks].sort((a,b)=>a-b);
    let curWeek = weeks[0];

    const $ = s => document.querySelector(s);
    const inWeek = (ranges, w) => ranges.some(r => r[0] <= w && w <= r[1]);
    const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

    function dateStr(d){
      return (d.getMonth()+1) + '/' + d.getDate();
    }

    function renderDates(){
      document.querySelectorAll('#schedule thead .date').forEach((el, i) => {
        const d = new Date(MON0);
        d.setDate(MON0.getDate() + (curWeek - 1) * 7 + i);
        el.textContent = dateStr(d);
      });
    }

    function renderBtns(){
      $('#weekBtns').innerHTML = weeks.map(w =>
        `<button class="wk-btn${w===curWeek?' on':''}" data-w="${w}">${w}</button>`).join('');
      document.querySelectorAll('#weekBtns .wk-btn').forEach(b => b.addEventListener('click', () => {
        curWeek = Number(b.dataset.w); renderAll();
      }));
    }

    function cellHTML(list, w){
      const inner = list.map(k => {
        const on = inWeek(k.ranges, w);
        return `<div class="course${on?'':' off'}" style="--c:var(${k.color})">
          <div class="name">${esc(k.name)}</div>
          <div class="meta"><b>${esc(k.teacher)}</b> @ ${esc(k.loc)}</div>
          <span class="week">${esc(k.wk)}</span>
        </div>`;
      }).join('');
      return `<div class="cell-inner">${inner}</div>`;
    }

    function renderSchedule(){
      let html = '';
      PERIODS.forEach((p, prd) => {
        html += `<tr><td class="time"><span class="period">${p}</span><span class="clock">${TIMES[p]||''}</span></td>`;
        for (let d = 0; d < 5; d++){
          const c = CELLS.find(x => x.day===d && x.prd===prd);
          html += c ? `<td class="cell">${cellHTML(c.list, curWeek)}</td>` : `<td class="empty"></td>`;
        }
        html += '</tr>';
      });
      $('#scheduleBody').innerHTML = html;
      renderDates();
      $('.subtitle').textContent = `第 ${curWeek} 周 · 每周课程安排`;
    }

    function renderLegend(){
      const seen = new Set(); let html = '';
      CELLS.forEach(c => c.list.forEach(k => {
        if (!seen.has(k.name)){ seen.add(k.name);
          html += `<span class="item"><span class="dot" style="background:var(${k.color})"></span>${esc(k.name)}</span>`;
        }
      }));
      $('#legend').innerHTML = html;
    }

    const DAYS = ['周一','周二','周三','周四','周五','周六'];
    function renderDetail(){
      $('#detailBody').innerHTML = [...COURSES]
        .sort((a,b) => (DAYS.indexOf(a.day) - DAYS.indexOf(b.day))
                      || (PERIODS.indexOf(a.prd) - PERIODS.indexOf(b.prd)))
        .map(c => {
          const on = inWeek(c.ranges, curWeek);
          return `<tr${on?'':' style="opacity:.35"'}>
            <td class="cname"><span class="dot" style="background:var(${c.color})"></span>${esc(c.name)}</td>
            <td><span class="tag">${esc(c.day)}</span></td>
            <td>${esc(c.prd)}</td><td>${esc(TIMES[c.prd]||'')}</td>
            <td>${esc(c.loc)}</td><td>${esc(c.teacher)}</td>
            <td><span class="tag week-tag" style="--c:var(${c.color})">${esc(c.wk)}</span></td>
          </tr>`;
        }).join('');
    }

    function renderAll(){ renderBtns(); renderSchedule(); renderLegend(); renderDetail(); }

    const tabs = document.querySelectorAll('.tab');
    const panels = document.querySelectorAll('.panel');
    tabs.forEach(tab => tab.addEventListener('click', () => {
      const target = document.getElementById(tab.dataset.tab);
      if (!target) return;
      tabs.forEach(t => t.classList.remove('active'));
      panels.forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      target.classList.add('active');
    }));

    renderAll();
  </script>

</body>
</html>
